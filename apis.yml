name: Millennial Fox
description: 'Millennial Fox, Inc. is a Los Angeles-based consumer company backed by
  Lightspeed Venture Partners that set out to bridge the gap between entertainment and fitness. Its
  flagship product, Tracks Battle Squad, was a socially gamified workout companion for iOS and watchOS
  that integrated with the Apple Health app to turn physical activity into points, badges, and
  accessories for a virtual 3D fox character. The app launched in 2017, was featured on Apple Music''s
  Planet of the Apps, and has since been removed from the App Store; the company appears inactive and
  exposes no public API, developer portal, documentation, or well-known surface.'
